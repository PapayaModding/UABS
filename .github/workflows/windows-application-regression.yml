name: Windows full application regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-application-tests:
    if: github.repository == 'PapayaModding/UABS' && github.ref == 'refs/heads/v2-recovery'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      REGRESSION_EVIDENCE: tools/windows-regression/artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: v2-recovery
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact recovery checkout
        id: verify
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path $env:REGRESSION_EVIDENCE -Force | Out-Null
          $record = @{
            verified = $false; expectedCommit = $env:GITHUB_SHA
            repository = $env:GITHUB_REPOSITORY; ref = $env:GITHUB_REF
            runnerImage = $env:ImageOS; imageVersion = $env:ImageVersion
            os = [Environment]::OSVersion.ToString(); utc = [DateTime]::UtcNow.ToString('o')
            runUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          }
          try {
            Get-Command git -ErrorAction Stop | Out-Null
            $record.commit = git rev-parse HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve HEAD.' }
            $record.branch = git symbolic-ref --quiet --short HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Detached HEAD is not permitted.' }
            $record.root = git rev-parse --show-toplevel
            if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve repository root.' }
            $record.origin = git remote get-url origin
            if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve origin.' }
            if ($env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or $record.repository -cne 'PapayaModding/UABS' -or
                $record.ref -cne 'refs/heads/v2-recovery' -or $record.branch -cne 'v2-recovery' -or
                $env:GITHUB_SHA -cnotmatch '\A[0-9a-f]{40}\z' -or $record.commit -cne $env:GITHUB_SHA -or
                $record.origin -cnotin @('https://github.com/PapayaModding/UABS', 'https://github.com/PapayaModding/UABS.git') -or
                -not [IO.Path]::GetFullPath($record.root).Equals([IO.Path]::GetFullPath($env:GITHUB_WORKSPACE), [StringComparison]::OrdinalIgnoreCase)) {
              throw 'Checkout is not the exact dispatched recovery commit/repository. No reset, pull or branch substitution.'
            }
            $record.verified = $true
            Write-Host "Full application regression: $($record.branch) at $($record.commit)"
          } catch {
            $record.error = $_.Exception.Message
            throw
          } finally {
            $record | ConvertTo-Json -Depth 10 | Set-Content "$env:REGRESSION_EVIDENCE/environment.json" -Encoding utf8NoBOM
          }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x
      - name: Record SDK and test the evidence summarizer
        run: |
          dotnet --info 2>&1 | Tee-Object -FilePath "$env:REGRESSION_EVIDENCE/dotnet-info.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tools/windows-regression/tests -v 2>&1 | Tee-Object -FilePath "$env:REGRESSION_EVIDENCE/summarizer-tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore and build the complete application test project
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          dotnet restore Avalonia/UABS.UnityAssets.Tests/UABS.UnityAssets.Tests.csproj --nologo 2>&1 | Tee-Object -FilePath "$env:REGRESSION_EVIDENCE/restore.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build Avalonia/UABS.UnityAssets.Tests/UABS.UnityAssets.Tests.csproj -c Debug --no-restore --nologo -m:1 -nr:false -p:UseSharedCompilation=false 2>&1 | Tee-Object -FilePath "$env:REGRESSION_EVIDENCE/build.log"
          exit $LASTEXITCODE
      - name: Run the FULL application suite (no filters)
        id: tests
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $results = Join-Path $env:REGRESSION_EVIDENCE 'test-results'
          New-Item -ItemType Directory -Path $results -Force | Out-Null
          $execution = @{ commit = $env:GITHUB_SHA; startedUtc = [DateTime]::UtcNow.ToString('o'); exitCode = $null }
          $execution | ConvertTo-Json | Set-Content "$env:REGRESSION_EVIDENCE/execution.json" -Encoding utf8NoBOM
          try {
            dotnet test Avalonia/UABS.UnityAssets.Tests/UABS.UnityAssets.Tests.csproj -c Debug --no-build --no-restore --nologo `
              --logger 'trx;LogFileName=windows-full.trx' --logger 'console;verbosity=normal' `
              --results-directory $results --blame --diag "$env:REGRESSION_EVIDENCE/vstest.log" `
              2>&1 | Tee-Object -FilePath "$env:REGRESSION_EVIDENCE/console.log"
            $execution.exitCode = $LASTEXITCODE
          } catch {
            $execution.error = $_.Exception.ToString()
            throw
          } finally {
            $execution.finishedUtc = [DateTime]::UtcNow.ToString('o')
            $execution | ConvertTo-Json -Depth 10 | Set-Content "$env:REGRESSION_EVIDENCE/execution.json" -Encoding utf8NoBOM
          }
          if ($null -eq $execution.exitCode) { throw 'No test exit code; complete regression is not established.' }
          exit $execution.exitCode
      - name: Summarize all outcomes and compare the recorded Linux baseline
        if: always()
        env:
          VERIFIED: ${{ steps.verify.outcome }}
          TEST_STEP_OUTCOME: ${{ steps.tests.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          New-Item -ItemType Directory -Path $env:REGRESSION_EVIDENCE -Force | Out-Null
          if ($env:VERIFIED -ne 'success') {
            @{ status = 'BLOCKED'; detail = 'Exact recovery checkout not verified; tests not accepted.'; expectedCommit = $env:GITHUB_SHA } |
              ConvertTo-Json | Set-Content "$env:REGRESSION_EVIDENCE/summary.json" -Encoding utf8NoBOM
            '## Full Windows regression: BLOCKED (checkout verification)' >> $env:GITHUB_STEP_SUMMARY
            exit 1
          }
          python tools/windows-regression/summarize.py --evidence $env:REGRESSION_EVIDENCE --expected-commit $env:GITHUB_SHA `
            --job-status $env:JOB_STATUS --test-step-outcome $env:TEST_STEP_OUTCOME --step-summary $env:GITHUB_STEP_SUMMARY
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-full-application-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            tools/windows-regression/artifacts/**/*.json
            tools/windows-regression/artifacts/**/*.log
            tools/windows-regression/artifacts/**/*.trx
            tools/windows-regression/artifacts/**/*.xml
            tools/windows-regression/artifacts/**/*.md
